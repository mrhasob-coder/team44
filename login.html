<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Campus Textbook Exchange</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Campus Textbook Exchange</h1>
    <p class="lead">Log in with your university email.</p>

    <form id="login-form" novalidate>
      <label for="email">University email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@ku.edu.kw" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="login-button" type="submit">Log in</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <p><a href="index.html">Don't have an account? Sign up</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
